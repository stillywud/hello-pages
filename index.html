<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好，Cloudflare Pages</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    max-width: 520px;
  }
  h1 { font-size: 32px; margin-bottom: 16px; }
  p { color: #666; line-height: 1.8; }
  .badge {
    display: inline-block; margin-top: 24px;
    background: #f6821f; color: #fff;
    padding: 8px 20px; border-radius: 999px; font-size: 14px;
  }
  code { background: #f4f4f4; padding: 2px 8px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎉 部署成功</h1>
    <p>这是你的第一个 Cloudflare Pages 站点。<br>
    修改仓库里的 <code>index.html</code> 并 push，<br>网站会自动重新部署。</p>
    <span class="badge">Powered by Cloudflare Pages</span>
  </div>
</body>
</html>
